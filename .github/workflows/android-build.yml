name: Build Witnessed APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o witnessed-android.zip -d _unpacked
          ls _unpacked
      - name: Apply source overrides
        run: |
          DEST=_unpacked/witnessed-android/app/src/main/java/com/trillix/witnessed
          cp app/src/main/java/com/trillix/witnessed/domain/Insights.kt "$DEST/domain/Insights.kt"
          cp app/src/main/java/com/trillix/witnessed/ui/AppViewModel.kt "$DEST/ui/AppViewModel.kt"
          cp app/src/main/java/com/trillix/witnessed/ui/Home.kt "$DEST/ui/Home.kt"
          cp app/src/main/java/com/trillix/witnessed/service/WitnessAccessibilityService.kt "$DEST/service/WitnessAccessibilityService.kt"
          echo "Overrides applied:"
          ls -l "$DEST/domain/Insights.kt" "$DEST/ui/AppViewModel.kt" "$DEST/ui/Home.kt" "$DEST/service/WitnessAccessibilityService.kt"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: _unpacked/witnessed-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: witnessed-debug-apk
          path: _unpacked/witnessed-android/app/build/outputs/apk/debug/*.apk
